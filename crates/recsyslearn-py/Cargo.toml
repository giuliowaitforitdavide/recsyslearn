[package]
name = "recsyslearn-py"
description = "Python bindings for recsyslearn-core."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]
doc = false
test = false
doctest = false

[dependencies]
recsyslearn-core.workspace = true
numpy.workspace = true
# abi3: a single wheel per platform works on every CPython >= 3.11.
pyo3 = { workspace = true, features = ["abi3-py311"] }

[lints]
workspace = true
