version: 2
updates:
    - package-ecosystem: "uv"
      directory: "/"
      schedule:
          interval: "monthly"
      commit-message:
          prefix: "build"
          prefix-development: "build"
          include: "scope"
      groups:
          dev-dependencies:
              dependency-type: "development"
          dependencies:
              dependency-type: "production"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "monthly"
      commit-message:
          prefix: "ci"
      groups:
          github-actions:
              patterns:
                  - "*"
