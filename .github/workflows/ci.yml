name: CI

on:
    push:
        branches:
            - "main"
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    rust:
        name: Rust (fmt, clippy, tests)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install the toolchain pinned in rust-toolchain.toml
              run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
            - name: Format
              run: cargo fmt --all --check
            - name: Clippy
              run: cargo clippy --workspace --all-targets --locked -- -D warnings
            - name: Test the core
              run: cargo test -p recsyslearn-core --locked
            - name: Document the core
              run: cargo doc -p recsyslearn-core --no-deps --locked
              env:
                  RUSTDOCFLAGS: -D warnings

    msrv:
        name: Rust (minimum supported version)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Read rust-version from Cargo.toml
              id: msrv
              run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
            # The version comes from a file of the pull request: it reaches the shell
            # as a variable, never as part of the script.
            - name: Install the minimum supported Rust
              env:
                  MSRV: ${{ steps.msrv.outputs.version }}
              run: rustup toolchain install "$MSRV" --profile minimal
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
            - name: Check
              env:
                  MSRV: ${{ steps.msrv.outputs.version }}
              run: cargo "+$MSRV" check --workspace --locked

    lint:
        name: Python (ruff)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  python-version: "3.12"
            # Only Ruff is needed to lint; its version is pinned in the dev group of pyproject.toml
            - name: Lint
              run: uv run --locked --only-group dev ruff check .
            - name: Format
              run: uv run --locked --only-group dev ruff format --check .

    tests:
        name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                python-version: ["3.11", "3.12", "3.13", "3.14"]
                include:
                    - os: macos-latest
                      python-version: "3.13"
                    - os: windows-latest
                      python-version: "3.13"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install the toolchain pinned in rust-toolchain.toml
              run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
            - name: Set up uv and Python ${{ matrix.python-version }}
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Build and install
              run: uv sync --locked
            - name: Test
              run: uv run --locked pytest
            - name: Run the examples
              shell: bash
              run: for example in examples/*.py; do uv run --locked python "$example"; done

    integration:
        name: Reproduction of published results
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install the toolchain pinned in rust-toolchain.toml
              run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
            - name: Set up uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  python-version: "3.13"
            # The data files are public and pinned to a commit: download them only once.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .integration-data
                  key: integration-data-${{ hashFiles('tests/integration/*.py') }}
                  restore-keys: integration-data-
            - name: Build and install
              run: uv sync --locked
            - name: Reproduce the papers
              run: uv run --locked pytest -m integration

    minimum-dependencies:
        name: Python 3.11 with the oldest supported numpy and pandas
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install the toolchain pinned in rust-toolchain.toml
              run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
            - name: Set up uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  python-version: "3.11"
            - name: Build and install
              run: |
                  # Turn the lower bounds of the runtime dependencies into exact pins.
                  sed -n 's/^dependencies = \[\(.*\)\]/\1/p' pyproject.toml | tr -d '" ' | tr ',' '\n' | sed 's/>=/==/' > minimum.txt
                  cat minimum.txt
                  uv venv
                  uv pip install . --constraint minimum.txt "pytest>=8"
            - name: Test
              run: uv run --no-sync pytest

    docs:
        name: Documentation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  python-version: "3.12"
            # The native module is mocked in docs/conf.py: no Rust toolchain is needed.
            - name: Install the documentation dependencies
              run: uv sync --locked --no-install-project --no-default-groups --group docs
            - name: Build
              run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html
