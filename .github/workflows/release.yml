name: Release

# Wheels are built on every run; they are published to PyPI only for a GitHub release.
on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    wheels:
        name: Wheel for ${{ matrix.target }} (${{ matrix.manylinux || matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
                    - { os: ubuntu-latest, target: aarch64, manylinux: auto }
                    - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
                    - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
                    - { os: macos-latest, target: aarch64, test: true }
                    - { os: macos-latest, target: x86_64 }
                    - { os: windows-latest, target: x64, test: true }
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  python-version: "3.12"
            # abi3: one wheel per platform covers every supported CPython.
            - name: Build
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              with:
                  target: ${{ matrix.target }}
                  manylinux: ${{ matrix.manylinux }}
                  args: --release --locked --out dist
                  sccache: "true"
            - name: Test the wheel
              if: matrix.test
              shell: bash
              run: |
                  uv venv wheel-env
                  uv pip install --python wheel-env dist/*.whl pytest
                  if [ -x wheel-env/bin/python ]; then
                    wheel-env/bin/python -m pytest
                  else
                    wheel-env/Scripts/python -m pytest
                  fi
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
                  path: dist

    sdist:
        name: Source distribution
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Build
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
              with:
                  command: sdist
                  args: --out dist
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: sdist
                  path: dist

    publish:
        name: Publish to PyPI
        if: github.event_name == 'release'
        needs: [wheels, sdist]
        runs-on: ubuntu-latest
        # Trusted publishing: PyPI accepts the upload because of who is asking (this
        # workflow, in this environment), proved by a short-lived OIDC token. There is
        # no API token to store; `id-token: write` is what lets the job request one.
        environment:
            name: pypi
            url: https://pypi.org/p/recsyslearn
        permissions:
            id-token: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: dist
                  merge-multiple: true
            - name: Publish
              uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
