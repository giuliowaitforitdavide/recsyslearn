name: pre-commit

on:
    push:
        branches:
            - "main"
    pull_request:
        branches:
            - "main"

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Install Ruff
              # Only Ruff is needed to lint; the version stays pinned in requirements_dev.txt
              run: |
                  python -m pip install --upgrade pip
                  pip install "$(grep '^ruff==' requirements_dev.txt)"
            - name: Lint with Ruff
              run: ruff check .
