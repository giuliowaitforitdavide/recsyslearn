name: pre-commit

on:
    push:
        branches:
            - "main"
    pull_request:
        branches:
            - "main"

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  python-version: "3.11"
            - name: Lint with Ruff
              # Only Ruff is needed to lint; the version stays pinned in the dev group of pyproject.toml
              run: uv run --locked --only-group dev ruff check .
