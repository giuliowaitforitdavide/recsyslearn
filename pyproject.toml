[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recsyslearn"
version = "3.0.0"
description = "A library to compute fairness of recommender systems."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giulio Davide Carparelli", email = "giulio.davide.97@gmail.com" }]
keywords = ["recsyslearn"]
requires-python = ">=3.10"
classifiers = [
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.urls]
Homepage = "https://github.com/giuliowaitforitdavide/recsyslearn"
Documentation = "https://recsyslearn.readthedocs.io"

[dependency-groups]
dev = [
    "bump-my-version",
    "pre-commit",
    # Keep in sync with the ruff-pre-commit rev in .pre-commit-config.yaml
    "ruff==0.1.6",
]
docs = ["sphinx", "sphinx-rtd-theme"]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["recsyslearn", "recsyslearn.*"]

[tool.bumpversion]
current_version = "3.0.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "recsyslearn/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "docs/conf.py"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
search = """
name = "recsyslearn"
version = "{current_version}"
"""
replace = """
name = "recsyslearn"
version = "{new_version}"
"""
