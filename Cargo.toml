[workspace]
resolver = "3"
members = ["crates/recsyslearn-core", "crates/recsyslearn-py"]

[workspace.package]
version = "4.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Giulio Davide Carparelli <giuliowaitforitdavide@duck.com>"]
repository = "https://github.com/giuliowaitforitdavide/recsyslearn"
homepage = "https://github.com/giuliowaitforitdavide/recsyslearn"
documentation = "https://recsyslearn.readthedocs.io"
readme = "README.rst"
keywords = ["recommender-systems", "evaluation", "fairness", "metrics"]
categories = ["science", "mathematics"]

[workspace.dependencies]
recsyslearn-core = { path = "crates/recsyslearn-core", version = "4.0.0" }
numpy = "0.30"
pyo3 = "0.30"
rayon = "1.12"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Counts and positions are converted to f64 on purpose; they stay far below 2^52.
cast_precision_loss = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
